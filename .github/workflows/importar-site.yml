name: Fixar configuração da Cloudflare

on:
  push:
    paths:
      - ".github/workflows/importar-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configurar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preservar D1 e variáveis
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          hosting_path = Path(".openai/hosting.json")
          hosting = json.loads(hosting_path.read_text())
          hosting["d1"] = "DB"
          hosting_path.write_text(
              json.dumps(hosting, indent=2, ensure_ascii=False) + "\n"
          )

          vite_path = Path("vite.config.ts")
          vite = vite_path.read_text()

          vite = vite.replace(
              "00000000-0000-4000-8000-000000000000",
              "bd69e88e-75c7-450e-9e23-7b2c0f88511c"
          )

          marker = 'compatibility_flags: ["nodejs_compat"],'
          if "keep_vars: true" not in vite:
              vite = vite.replace(
                  marker,
                  marker + "\n  keep_vars: true,"
              )

          vite_path.write_text(vite)
          PY

      - name: Salvar configuração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openai/hosting.json vite.config.ts
          git commit -m "Preservar D1 e variáveis nos próximos deploys"
          git push
