name: Importar site do ZIP

on:
  push:
    paths:
      - "cha-casa-nova-github.zip"
      - ".github/workflows/importar-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Descompactar site
        run: |
          unzip -o cha-casa-nova-github.zip
          rm cha-casa-nova-github.zip

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importar código completo do site"
          git push
