name: Deploy Producao (Cloudflare proprio)

on:
  workflow_dispatch:
    inputs:
      aplicar_migrations:
        description: "Aplicar migrations no banco D1 de producao (primeira vez: sim)"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao
        run: npx vinext build

      - name: Apontar banco D1 real
        run: node scripts/prepare-production-deploy.mjs "${{ vars.CLOUDFLARE_D1_DATABASE_ID }}"

      - name: Aplicar migrations no D1 remoto
        if: ${{ inputs.aplicar_migrations == 'sim' }}
        working-directory: dist/server
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar Worker
        working-directory: dist/server
        run: npx wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
