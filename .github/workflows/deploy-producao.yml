name: Deploy Producao (Cloudflare proprio)

on:
  workflow_dispatch:
    inputs:
      aplicar_migrations:
        description: "Aplicar migrations no banco D1 de producao (nao selecionar para esta correcao do admin)"
        required: true
        default: "nao"
        type: choice
        options:
          - "nao"
          - "sim"
  push:
    branches:
      - "plataforma/fase-8-verificacao-final"
    paths:
      - "worker/index.ts"
      - "lib/event-access.ts"
      - "lib/telegram-notifications.ts"
      - "app/api/reservations/**"
      - "app/api/contributions/**"
      - "app/api/confirmations/**"
      - "components/rsvp-form.tsx"
      - "app/admin/**"
      - "app/gift-catalog-v2.tsx"
      - "app/globals.css"
      - "public/project/**"
      - "scripts/prepare-production-deploy.mjs"
      - "tests/phase-8-security.test.mjs"
      - ".github/workflows/deploy-producao.yml"

permissions:
  contents: read

concurrency:
  group: cha-casa-nova-producao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar protecoes da fundacao
        run: npm run test:foundation

      - name: Executar regressao completa
        run: npm test

  deploy:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao
        run: npx vinext build

      - name: Apontar banco D1 real
        run: node scripts/prepare-production-deploy.mjs "${{ vars.CLOUDFLARE_D1_DATABASE_ID }}"

      - name: Aplicar migrations no D1 remoto
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.aplicar_migrations == 'sim' }}
        working-directory: dist/server
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar Worker existente
        working-directory: dist/server
        run: npx wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
